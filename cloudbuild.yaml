# Cloud Build pipeline: build the container, push it to Artifact Registry,
# then deploy to Cloud Run. Triggered automatically on every push to `main`
# (see the "niat-deploy" trigger, connected to github.com/aimiizdihar1987-tech/niat1).
#
# Secrets (Gemini/Supabase/auth/Apps Script hub/cron) live in Secret Manager —
# see DEPLOY_GCLOUD.md section 4. GOOGLE_OAUTH_TOKEN_JSON / NIAT_REQUIRE_GOOGLE_OAUTH
# are deliberately omitted until Agent 4's one-time Google OAuth consent is done
# (python niat_google.py --authorize), per DEPLOY_GCLOUD.md section 3.
#
# --min-instances=1 keeps one instance warm at all times so teachers never eat
# a cold start (~1.5-2s to boot a fresh container) — Cloud Run's default of 0
# scales the service to nothing after ~15 min idle. This has a small recurring
# cost (roughly USD 5-10/month for one idle 512Mi/1vCPU instance in
# asia-southeast1); drop the flag to go back to scale-to-zero if that's not
# worth it for this traffic level.
#
# GOOGLE_API_KEY is pinned to gemini-api-key:2, NOT :latest — version 3 (added
# 2026-09-16 while trying to move off a free-tier key with only 20
# requests/day) turned out to be worse: gemini-2.5-flash is blocked for new
# API keys entirely, and the suggested replacement (gemini-3.6-flash) needs
# prepay credits this project doesn't have yet. Version 3 is disabled. Once
# billing/prepay is sorted at https://ai.studio/projects (see RELIABILITY.md
# or ask whoever set this up), re-enable that version and repoint this to
# :latest or the new version number — until then, :latest is a dead
# reference and deploying with it will fail outright.
#
# GOOGLE_API_KEY_2 is a second, independent free-tier key (its own separate
# Google Cloud project, so its quota doesn't share a pool with the primary
# key) — server.py's call_gemini() automatically fails over to it when the
# primary key is rate-limited. It only supports gemini-3.6-flash (see
# MODEL_2 in server.py), not the primary's gemini-2.5-flash.

steps:
  # Regression gate: run the unit test suite BEFORE building/deploying, so a
  # change that breaks a locked-in safety property (e.g. the human-in-the-loop
  # worksheet review — tests/test_worksheet_review.py — never auto-posting a
  # differentiated worksheet without teacher review) fails the build instead
  # of silently shipping. Cloud Build stops the whole pipeline on the first
  # failing step, so no docker build/deploy runs if tests fail.
  - name: "python:3.12-slim"
    entrypoint: bash
    env:
      - "NIAT_CONTAINER=1"
      - "NIAT_JSON_LOGS=1"
    args:
      - "-c"
      - |
        pip install --quiet -r requirements.txt
        python -m unittest discover -s tests -v

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/niat/niat:$COMMIT_SHA"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/niat/niat:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/niat/niat"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "niat"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/niat/niat:$COMMIT_SHA"
      - "--region=asia-southeast1"
      - "--allow-unauthenticated"
      - "--min-instances=1"
      - "--set-env-vars=NIAT_REQUIRE_HUB=1,TEACHER_EMAIL=jpn-perlis-cm16@moe-dl.edu.my,NIAT_BUILD_SHA=$SHORT_SHA,NIAT_REGION=asia-southeast1,NIAT_JSON_LOGS=1,NIAT_PUBLIC_URL=https://niat-1094321285675.asia-southeast1.run.app"
      - "--set-secrets=GOOGLE_API_KEY=gemini-api-key:2,GOOGLE_API_KEY_2=gemini-api-key-2:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-key:latest,NIAT_AUTH_SECRET=niat-auth-secret:latest,APPSCRIPT_HUB_URL=apps-script-hub-url:latest,APPSCRIPT_HUB_KEY=apps-script-hub-key:latest,NIAT_CRON_SECRET=niat-cron-secret:latest,GAMMA_API_KEY=gamma-api-key:latest"

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/niat/niat:$COMMIT_SHA"
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/niat/niat:latest"

options:
  logging: CLOUD_LOGGING_ONLY
