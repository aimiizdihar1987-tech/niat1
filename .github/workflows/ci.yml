name: CI

# Runs on every push and pull request to main, so the test suite and the
# container build are proven on a clean machine and not only on the teacher's
# laptop. The badge in README.md reflects the result of this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # NIAT_CONTAINER keeps the tests off the desktop-only code paths
        # (local SQLite question bank, Windows scheduled task).
        env:
          NIAT_CONTAINER: "1"
          NIAT_JSON_LOGS: "1"
        run: python -m unittest discover -s tests -v

      - name: Byte-compile every module
        run: python -m compileall -q . -x "classroom-simulator|node_modules|__pycache__"

  container:
    name: Container build + boot probe
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t niat:ci .

      - name: Boot the container and probe its health endpoints
        # Proves the image actually serves traffic — a build that compiles but
        # cannot answer /api/health is not a deployable build.
        # The image refuses to boot with an unsafe configuration (see
        # runtime_configuration_errors) — that guard is the point, so CI feeds
        # it a well-formed *dummy* configuration. No real credentials: the
        # probe only exercises the endpoints that do not call out, and the
        # unreachable Supabase is exactly what /api/status should report as
        # "degraded" rather than crash on.
        run: |
          docker run -d --name niat-ci -p 8080:8080 \
            -e NIAT_CONTAINER=1 -e PORT=8080 -e NIAT_BUILD_SHA=${GITHUB_SHA::7} \
            -e NIAT_STORAGE=supabase \
            -e NIAT_AUTH_SECRET=ci-dummy-secret-not-used-in-production-0123456789 \
            -e GOOGLE_API_KEY=ci-dummy-key \
            -e SUPABASE_URL=https://ci-dummy.supabase.co \
            -e SUPABASE_ANON_KEY=ci-dummy-anon-key \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-dummy-service-key \
            -e NIAT_JSON_LOGS=1 \
            niat:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "health endpoint is up after ${i}s"; break
            fi
            sleep 1
          done
          echo "--- /api/health ---";  curl -fsS http://localhost:8080/api/health
          echo "--- /api/status ---";  curl -fsS http://localhost:8080/api/status
          echo "--- /api/workflow ---"; curl -fsS http://localhost:8080/api/workflow

      - name: Container logs
        if: always()
        run: docker logs niat-ci || true

      - name: Tear down
        if: always()
        run: docker rm -f niat-ci || true
