<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Niat</title>
  <link rel="icon" type="image/png" href="niat-logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Niat" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica World","Helvetica Neue",Helvetica,"Inter",Arial,sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #22333e;
      background:
        radial-gradient(700px 420px at 80% -10%, rgba(38,193,178,.16), transparent 60%),
        radial-gradient(700px 460px at -8% 30%, rgba(238,111,160,.13), transparent 60%),
        radial-gradient(600px 380px at 40% 110%, rgba(246,185,59,.16), transparent 60%),
        radial-gradient(rgba(20,184,166,.07) 1.5px, transparent 1.5px),
        #eef4f6;
      background-size: auto, auto, auto, 28px 28px, auto;
    }
    .card {
      background: #ffffff; border-radius: 28px; padding: 38px 36px 32px;
      width: 100%; max-width: 380px; border: 2px solid #e2ebef;
      box-shadow: 0 22px 48px rgba(34,51,62,.14);
      text-align: center;
    }
    @keyframes logo-float {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-.7deg); box-shadow: 0 8px 18px rgba(34,51,62,.12); }
      50% { transform: translate3d(0, -8px, 0) rotate(.9deg); box-shadow: 0 16px 26px rgba(34,51,62,.16); }
    }
    .card img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 10px;
      background: #fff; border-radius: 20px; padding: 4px;
      animation: logo-float 5.6s ease-in-out infinite; transform-origin: 50% 55%;
      will-change: transform, box-shadow; }
    h1 { font-family: "Helvetica World","Helvetica Neue",Helvetica,"Inter",Arial,sans-serif; font-size: 30px;
      font-weight: 900; letter-spacing: -.01em; color: #22333e; }
    h1 span { color: #0e8578; }
    .tag { font-size:12.5px; color: #5a707d;
      font-weight: 600; margin: 6px 0 24px; }
    label { display: block; text-align: left; font-size:14px; font-weight: 700;
            color: #3b4f5c; margin: 12px 0 5px; }
    input {
      width: 100%; padding: 11px 13px; border: 2px solid #e2ebef;
      border-radius: 14px; font-size:16px; outline: none; transition: .15s;
      background: #ffffff; color: #22333e; font-family: inherit;
    }
    input:focus { border-color: #0e8578; box-shadow: 0 0 0 4px rgba(20,184,166,.16); }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 999px;
      background: #0e8578; color: #ffffff;
      font-size:15px; font-weight: 800;
      cursor: pointer; transition: .18s; font-family: inherit;
      box-shadow: 0 4px 0 #0b6b60;
    }
    button:hover { background: #0f978a; transform: translateY(-2px); box-shadow: 0 6px 0 #0b6b60, 0 12px 22px rgba(14,133,120,.25); }
    button:active { transform: translateY(1px); box-shadow: 0 2px 0 #0b6b60; }
    button:disabled { opacity: .6; cursor: wait; transform: none; box-shadow: none; }
    .err {
      display: none; margin-top: 14px; padding: 10px 12px; border-radius: 14px;
      background: #fef2f2; border: 2px solid #fecaca; color: #b91c1c; font-size:14.5px;
    }
    .foot { margin-top: 22px; font-size:13.5px; color: #5a707d; }
    .foot a { color: #0b6b60; font-weight: 700; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) {
      .card img { animation: none; will-change: auto; }
    }
  </style>
</head>
<body>
  <form class="card" id="f">
    <img src="niat-logo.png" alt="Niat logo" />
    <h1>Ni<span>at</span></h1>
    <p class="tag">From Intention to Intervention</p>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" autofocus required />
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required />
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e"></div>
    <p class="foot">New teacher? <a href="signup.html">Create an account</a></p>
  </form>
  <script>
    const $ = (id) => document.getElementById(id);
    $("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("b").disabled = true; $("e").style.display = "none";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: $("u").value, password: $("p").value }),
        });
        const d = await r.json();
        if (r.ok && d.ok) {
          try { localStorage.setItem("niat-user", $("u").value.trim()); } catch (_) {}
          const next = new URLSearchParams(location.search).get("next");
          location.href = next && next.startsWith("/") ? next : "/";
        } else {
          throw new Error(d.ralat || "Sign-in failed.");
        }
      } catch (err) {
        $("e").textContent = err.message;
        $("e").style.display = "block";
        $("b").disabled = false;
      }
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
