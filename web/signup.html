<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Niat</title>
  <link rel="icon" type="image/png" href="niat-logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Niat" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica World","Helvetica Neue",Helvetica,"Inter",Arial,sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #22333e; padding: 24px 16px;
      background:
        radial-gradient(700px 420px at 80% -10%, rgba(38,193,178,.16), transparent 60%),
        radial-gradient(700px 460px at -8% 30%, rgba(238,111,160,.13), transparent 60%),
        radial-gradient(600px 380px at 40% 110%, rgba(246,185,59,.16), transparent 60%),
        radial-gradient(rgba(20,184,166,.07) 1.5px, transparent 1.5px),
        #eef4f6;
      background-size: auto, auto, auto, 28px 28px, auto;
    }
    .card {
      background: #ffffff; border-radius: 28px; padding: 38px 36px 32px;
      width: 100%; max-width: 380px; border: 2px solid #e2ebef;
      box-shadow: 0 22px 48px rgba(34,51,62,.14);
      text-align: center;
    }
    .card img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 10px;
      background: #fff; border-radius: 20px; padding: 4px;
      box-shadow: 0 8px 18px rgba(34,51,62,.12); }
    h1 { font-family: "Helvetica World","Helvetica Neue",Helvetica,"Inter",Arial,sans-serif; font-size: 30px;
      font-weight: 900; letter-spacing: -.01em; color: #22333e; }
    h1 span { color: #0e8578; }
    .tag { font-size:12.5px; color: #5a707d;
      font-weight: 600; margin: 6px 0 24px; }
    label { display: block; text-align: left; font-size:14px; font-weight: 700;
            color: #3b4f5c; margin: 12px 0 5px; }
    input {
      width: 100%; padding: 11px 13px; border: 2px solid #e2ebef;
      border-radius: 14px; font-size:16px; outline: none; transition: .15s;
      background: #ffffff; color: #22333e; font-family: inherit;
    }
    input:focus { border-color: #0e8578; box-shadow: 0 0 0 4px rgba(20,184,166,.16); }
    .hint { display: block; text-align: left; font-size: 12px; color: #5a707d; margin-top: 5px; }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 999px;
      background: #0e8578; color: #ffffff;
      font-size:15px; font-weight: 800;
      cursor: pointer; transition: .18s; font-family: inherit;
      box-shadow: 0 4px 0 #0b6b60;
    }
    button:hover { background: #0f978a; transform: translateY(-2px); box-shadow: 0 6px 0 #0b6b60, 0 12px 22px rgba(14,133,120,.25); }
    button:active { transform: translateY(1px); box-shadow: 0 2px 0 #0b6b60; }
    button:disabled { opacity: .6; cursor: wait; transform: none; box-shadow: none; }
    .err {
      display: none; margin-top: 14px; padding: 10px 12px; border-radius: 14px;
      background: #fef2f2; border: 2px solid #fecaca; color: #b91c1c; font-size:14.5px;
    }
    .foot { margin-top: 22px; font-size:13.5px; color: #5a707d; }
    .foot a { color: #0b6b60; font-weight: 700; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <img src="niat-logo.png" alt="Niat logo" />
    <h1>Ni<span>at</span></h1>
    <p class="tag">Create your teacher account</p>
    <label for="n">Full name</label>
    <input id="n" autocomplete="name" autofocus required placeholder="e.g. Cikgu Aimi Izdihar" />
    <label for="u">Username</label>
    <input id="u" autocomplete="username" required pattern="[a-z0-9_.-]{3,32}" placeholder="e.g. cikguaimi" />
    <span class="hint">3-32 characters: lowercase letters, numbers, . _ -</span>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="new-password" required minlength="6" />
    <label for="p2">Confirm password</label>
    <input id="p2" type="password" autocomplete="new-password" required minlength="6" />
    <button id="b" type="submit">Create account</button>
    <div class="err" id="e"></div>
    <p class="foot">Already have an account? <a href="login.html">Sign in</a></p>
  </form>
  <script>
    const $ = (id) => document.getElementById(id);
    $("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("e").style.display = "none";
      const full_name = $("n").value.trim();
      const username = $("u").value.trim().toLowerCase();
      const password = $("p").value;
      const password2 = $("p2").value;
      if (password !== password2) {
        $("e").textContent = "Passwords do not match.";
        $("e").style.display = "block";
        return;
      }
      $("b").disabled = true;
      try {
        const r = await fetch("/api/signup", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ full_name, username, password }),
        });
        const d = await r.json();
        if (r.ok && d.ok) {
          try { localStorage.setItem("niat-user", username); } catch (_) {}
          location.href = "/";
        } else {
          throw new Error(d.ralat || "Could not create account.");
        }
      } catch (err) {
        $("e").textContent = err.message;
        $("e").style.display = "block";
        $("b").disabled = false;
      }
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
